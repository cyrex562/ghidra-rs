[package]
name = "ghidra-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
egui = "0.28"
eframe = "0.28"

# Scripting & Plugins
pyo3 = { version = "0.28", features = ["auto-initialize"] }
wasmer = "4.2"

# Utilities
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rayon = "1.10"
dashmap = "6.0"
once_cell = "1.19"
lru = "0.12"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
flate2 = "1.0"
zip = "2.2"                 # ArchiveBuilder / JarEntryRootNode (jar/zip read+write)
pulldown-cmark = "0.12"     # MarkdownToHtml (CommonMark -> HTML)
rsa = { version = "0.9", features = ["sha1", "sha2"] }   # SSH RSA signing / keygen
dsa = "0.6"                 # SSHSignatureCallback DSA signing
ssh-key = { version = "0.6", features = ["rsa", "dsa", "std"] }  # OpenSSH/PEM key format
tokio = { version = "1.37", features = ["full"] }
regex = "1.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
