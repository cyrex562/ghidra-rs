[package]
name = "ghidra-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI
egui = "0.27"
eframe = "0.27"

# Scripting & Plugins
pyo3 = { version = "0.21", features = ["extension-module"] }
wasmer = "4.2"

# Utilities
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
