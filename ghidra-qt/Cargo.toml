[package]
name = "ghidra-qt"
version = "0.1.0"
edition = "2021"
description = "Qt6 Widgets desktop shell for ghidra-rs"
license = "MIT"
build = "build.rs"

[[bin]]
name = "ghidra-qt"
path = "src/main.rs"

[dependencies]
ghidra-ui-model = { path = "../ghidra-ui-model" }
cxx = "1.0"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
cxx-build = "1.0"
cc = "1"
qt-build-utils = "0.10"
